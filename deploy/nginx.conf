server {
    listen 80;
    server_name piramallease.vibecopilot.ai;

    # Frontend (React SPA)
    root /var/www/piramallease/new-frontend/dist;
    index index.html;

    # Django API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin CSS/JS)
    location /static/ {
        alias /var/www/piramallease/Backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Django media files
    location /media/ {
        alias /var/www/piramallease/Backend/media/;
        expires 7d;
    }

    # SPA fallback — all other routes served by React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
